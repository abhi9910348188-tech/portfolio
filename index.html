<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14214A">
<title>Abhishek Bharti — Full Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14214A; --blue:#2B59C3; --sun:#FFC531; --coral:#FF6B4A; --chalk:#F7F5EF;
  --hud:#0F1838; --hud-muted:rgba(247,245,239,.62);
  --panel-bg:rgba(247,245,239,.97); --panel-ink:#14214A; --panel-muted:#55628A; --panel-line:rgba(20,33,74,.14); --panel-soft:rgba(43,89,195,.09);
  --display:"Anton", Impact, "Arial Narrow Bold", sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel-bg:rgba(15,24,56,.95); --panel-ink:#F7F5EF; --panel-muted:#A9B4D6; --panel-line:rgba(247,245,239,.14); --panel-soft:rgba(255,197,49,.12); color-scheme:dark; }
}
:root[data-theme="dark"]{ --panel-bg:rgba(15,24,56,.95); --panel-ink:#F7F5EF; --panel-muted:#A9B4D6; --panel-line:rgba(247,245,239,.14); --panel-soft:rgba(255,197,49,.12); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--navy)}
body{font-family:var(--body);color:var(--chalk);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.speed{position:fixed;inset:-10%;z-index:2;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.0) 0deg 4deg, rgba(255,255,255,.55) 4.4deg 4.8deg, rgba(255,255,255,0) 5.2deg 9deg);
  -webkit-mask:radial-gradient(ellipse at center, transparent 38%, #000 75%); mask:radial-gradient(ellipse at center, transparent 38%, #000 75%)}

/* HUD */
.score{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left));display:flex;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(-170%);transition:transform .6s cubic-bezier(.2,.9,.2,1);max-width:calc(100vw - 190px)}
body.live .score{transform:none}
.score .name{background:var(--sun);color:var(--navy);font-family:var(--display);font-size:18px;padding:7px 12px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.score .name i{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.score .event{background:var(--hud);font-family:var(--cond);font-weight:600;font-size:16px;padding:7px 12px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right));display:flex;gap:2px;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(-170%);transition:transform .6s .1s cubic-bezier(.2,.9,.2,1)}
body.live .stats{transform:none}
.stat{background:var(--hud);padding:5px 12px;text-align:center;min-width:66px;position:relative}
.stat b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;color:var(--sun);font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--cond);font-size:13px;color:var(--hud-muted)}
.stat.scorebox{min-width:96px}
.mult{position:absolute;top:3px;right:4px;font-family:var(--display);font-size:13px;background:var(--coral);color:#fff;border-radius:5px;padding:0 5px;opacity:0;transform:scale(.6);transition:transform .2s,opacity .2s}
.mult.on{opacity:1;transform:none}
.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.25)}}

.lower{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom,0px) + 88px);max-width:min(560px,calc(100vw - 24px));display:flex;transform:translateX(-120%);transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .3s,bottom .3s;pointer-events:none}
.lower.show{transform:none}
body.play .lower{bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}
.lower .who{background:var(--coral);color:#fff;font-family:var(--display);font-size:14px;padding:9px;writing-mode:vertical-rl;transform:rotate(180deg)}
.lower .text{background:rgba(15,24,56,.92);padding:10px 15px;font-size:clamp(14px,1.45vw,17px);line-height:1.4;font-weight:500;min-height:2.9em;display:flex;align-items:center}

.toast{position:fixed;z-index:6;left:50%;top:21%;transform:translate(-50%,0);opacity:0;font-family:var(--display);font-size:clamp(30px,5.4vw,58px);color:var(--sun);text-shadow:0 4px 0 var(--navy),0 10px 30px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap;text-align:center}
.toast small{display:block;font-family:var(--cond);font-weight:700;font-size:.4em;color:var(--chalk);text-shadow:0 2px 0 var(--navy)}
.toast.bad{color:var(--coral)}
.toast.pop{animation:pop 1.1s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}16%{opacity:1;transform:translate(-50%,0) scale(1.12)}70%{opacity:1;transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-26px) scale(.95)}}
.floaty{position:fixed;z-index:6;left:0;top:0;font-family:var(--display);font-size:22px;color:var(--sun);text-shadow:0 2px 0 var(--navy);pointer-events:none;animation:floaty .8s ease-out forwards;white-space:nowrap}
@keyframes floaty{to{transform:translate(-50%,-60px);opacity:0}}
.tip{position:fixed;z-index:6;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);background:var(--chalk);color:var(--navy);font-family:var(--cond);font-weight:700;font-size:16px;padding:7px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.tip.show{opacity:1}
.paused{position:fixed;inset:0;z-index:7;display:none;place-items:center;background:rgba(15,24,56,.55);padding:20px}
.pause-card{text-align:center;display:grid;gap:10px;width:min(300px,100%)}
.pause-card h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(48px,9vw,84px);color:var(--chalk);line-height:1}
.pause-card button{border:0;border-radius:12px;padding:14px;font-family:var(--cond);font-weight:700;font-size:18px;background:var(--chalk);color:var(--navy);transition:transform .15s}
.pause-card button.primary{background:var(--sun)}
.pause-card button:hover{transform:translateY(-2px)}
body.is-paused .paused{display:grid}

/* Panel */
.panel{position:fixed;z-index:6;right:max(12px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top,0px) + 76px);bottom:calc(env(safe-area-inset-bottom,0px) + 88px);width:min(370px,calc(100vw - 24px));
  background:var(--panel-bg);color:var(--panel-ink);border-radius:18px;padding:22px 22px 18px;overflow:auto;overscroll-behavior:contain;box-shadow:0 24px 70px -18px rgba(5,10,30,.6);
  transform:translateX(calc(100% + 30px));transition:transform .5s cubic-bezier(.7,0,.2,1);user-select:text;-webkit-user-select:text}
.panel.open{transform:none}
.panel .kicker{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--coral);margin:0 0 4px}
.panel h3{margin:0;font-family:var(--display);font-weight:400;font-size:31px;line-height:1.02;padding-right:30px}
.panel .meta{font-family:var(--cond);font-size:16px;font-weight:500;color:var(--panel-muted);margin:6px 0 14px}
.panel p{margin:0 0 12px;line-height:1.55;font-size:15.5px}
.panel h4{margin:18px 0 7px;font-family:var(--cond);font-size:16px;font-weight:700}
.panel ul{margin:0;padding:0;list-style:none}
.panel li{padding:9px 0;border-top:1px solid var(--panel-line);font-size:15px;line-height:1.45}
.panel li small{display:block;color:var(--panel-muted);font-family:var(--cond);font-weight:600;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--cond);font-weight:600;font-size:14.5px;padding:3px 10px;border-radius:6px;background:var(--panel-soft)}
.result{margin-top:16px;display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--navy);color:var(--chalk)}
.result strong{font-family:var(--display);font-weight:400;font-size:34px;color:var(--sun);line-height:1;white-space:nowrap}
.result span{font-size:14.5px;line-height:1.35}
.panel .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-line);background:transparent;color:var(--panel-ink);font-size:18px;line-height:1}
.links{display:grid;gap:8px;margin-top:6px}
.links a{display:flex;justify-content:space-between;gap:10px;padding:13px 15px;border-radius:10px;background:var(--navy);color:var(--chalk);text-decoration:none;font-weight:600;font-size:15px}
.links a span:last-child{opacity:.75;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a:hover{background:var(--blue)}
.links a.hot{background:var(--coral)}
.keys-list{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px;align-items:center}
kbd{font-family:var(--cond);font-weight:700;font-size:13px;background:var(--panel-soft);border:1px solid var(--panel-line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;white-space:nowrap}

/* Dock */
.dock{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;align-items:center;gap:7px;background:rgba(15,24,56,.92);border-radius:14px;padding:7px 8px;transform:translateY(170%);transition:transform .6s .2s cubic-bezier(.2,.9,.2,1)}
body.live .dock{transform:none}
.map{position:relative;flex:1;height:46px;min-width:0;touch-action:none;cursor:ew-resize}
.map .lane{position:absolute;left:10px;right:10px;top:26px;height:6px;border-radius:3px;background:rgba(247,245,239,.15)}
.map .done{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--blue)}
.map .runner{position:absolute;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--sun);border:3px solid var(--navy);box-shadow:0 0 0 2px var(--sun)}
.mk{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.mk span{font-family:var(--cond);font-weight:600;font-size:12.5px;color:var(--hud-muted);white-space:nowrap}
.mk::after{content:"";width:3px;height:14px;border-radius:2px;background:rgba(247,245,239,.4)}
.mk:hover span,.mk.on span{color:var(--sun)}
.mk.on::after{background:var(--sun)}
.ctl{display:flex;gap:5px}
.btn{height:42px;min-width:42px;border-radius:10px;border:0;background:rgba(247,245,239,.1);padding:0 11px;font-family:var(--cond);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:rgba(247,245,239,.2)}
.btn.primary{background:var(--sun);color:var(--navy)}
.btn[aria-pressed="true"].tog{background:var(--chalk);color:var(--navy)}
.btn.attn{animation:attn 1s 3}
@keyframes attn{50%{background:var(--coral);color:#fff}}
.btn svg{width:17px;height:17px;flex:none}

/* Game pad */
.pad{position:fixed;z-index:6;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-left));pointer-events:none}
body.play .pad{display:flex}
body.play.panel-open.touch .pad{opacity:.3}
.pad div{display:flex;gap:10px;align-items:flex-end}
.pad button{pointer-events:auto;width:70px;height:70px;border-radius:50%;border:0;background:rgba(15,24,56,.8);color:var(--chalk);font-family:var(--display);font-size:24px;touch-action:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:transform .06s}
.pad button.down{transform:scale(.92);background:var(--blue)}
.pad button.jump{background:var(--sun);color:var(--navy);width:86px;height:86px;font-size:19px}
.pad button.jump.down{background:#ffd866}
.pad button.dash{background:var(--coral);color:#fff;width:62px;height:62px;font-size:15px;position:relative;overflow:hidden}
.pad button.dash i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.35)}
@media (pointer:fine){ .pad button{width:56px;height:56px;font-size:19px} .pad button.jump{width:68px;height:68px;font-size:16px} .pad button.dash{width:52px;height:52px;font-size:13px} body.play .lower{bottom:calc(env(safe-area-inset-bottom,0px) + 160px)} }
.hint{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);font-family:var(--cond);font-weight:600;font-size:14px;color:rgba(247,245,239,.75);display:none;white-space:nowrap}
@media (pointer:fine){ body.play .hint{display:block} body.play .pad{bottom:calc(env(safe-area-inset-bottom,0px) + 98px)} }

/* Intro, countdown, results */
.intro{position:fixed;inset:0;z-index:8;display:grid;place-items:end center;padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 34px);background:linear-gradient(180deg,rgba(20,33,74,0) 25%,rgba(20,33,74,.9) 70%);transition:opacity .6s;overflow:auto}
body:not(.at-intro) .intro{opacity:0;pointer-events:none}
.intro-card{text-align:center;max-width:760px}
.intro .event{display:inline-block;font-family:var(--cond);font-weight:700;font-size:16px;background:var(--coral);color:#fff;padding:5px 12px;border-radius:6px;margin-bottom:14px}
.intro h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(54px,12vw,140px);line-height:.9;text-shadow:0 6px 0 var(--blue),0 20px 50px rgba(0,0,0,.35)}
.intro .role{font-family:var(--cond);font-weight:700;font-size:clamp(18px,2.2vw,24px);color:var(--sun);margin:14px 0 0}
.intro p.sub{font-size:clamp(16px,1.7vw,19px);line-height:1.45;color:rgba(247,245,239,.86);margin:10px auto 22px;max-width:44ch}
.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.choice{border:0;border-radius:14px;padding:14px 20px;text-align:left;flex:1 1 230px;max-width:300px;background:var(--chalk);color:var(--navy);transition:transform .15s}
.choice:hover{transform:translateY(-3px)}
.choice b{display:block;font-family:var(--display);font-weight:400;font-size:24px}
.choice span{font-size:14px;color:#55628A}
.choice.go{background:var(--sun)}
.intro .keys{margin:18px 0 0;font-family:var(--cond);font-size:15px;color:rgba(247,245,239,.62)}
.count{position:fixed;inset:0;z-index:9;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-size:clamp(120px,26vw,280px);color:var(--sun);text-shadow:0 10px 0 var(--navy),0 30px 80px rgba(0,0,0,.4)}
.count span{animation:countpop .8s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes countpop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
.results{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:20px;background:rgba(15,24,56,.55);opacity:0;pointer-events:none;transition:opacity .4s}
.results.show{opacity:1;pointer-events:auto}
.res-card{background:var(--panel-bg);color:var(--panel-ink);border-radius:20px;padding:24px;width:min(440px,100%);max-height:calc(100vh - 40px);overflow:auto;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);transform:translateY(20px) scale(.96);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.results.show .res-card{transform:none}
.medal{width:86px;height:86px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--navy);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.res-card h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px}
.res-card .big{font-family:var(--display);font-size:52px;color:var(--coral);line-height:1;margin:8px 0 2px}
.res-card .pb{font-family:var(--cond);font-weight:700;color:var(--blue);font-size:16px;min-height:1.2em}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0;text-align:left}
.res-grid div{background:var(--panel-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.res-grid b{display:block;font-family:var(--display);font-weight:400;font-size:22px}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res-actions button,.res-actions a{border:0;border-radius:12px;padding:13px;font-family:var(--cond);font-weight:700;font-size:17px;background:var(--navy);color:var(--chalk);text-decoration:none;text-align:center}
.res-actions .again{background:var(--sun);color:var(--navy);grid-column:1/-1;font-size:19px}
.loading{position:fixed;inset:0;z-index:20;background:var(--navy);display:grid;place-items:center;font-family:var(--cond);font-size:18px;color:var(--hud-muted);transition:opacity .5s}
.loading.gone{opacity:0;pointer-events:none}

@media (max-width:820px){
  .stats .stat:nth-child(3),.stats .stat:nth-child(4){display:none}
  .stat{min-width:56px;padding:5px 9px} .stat.scorebox{min-width:80px} .stat b{font-size:19px}
  .score .name{font-size:15px;padding:7px 10px} .score .event{font-size:14px;padding:7px 9px}
  .score{max-width:calc(100vw - 180px)}
  .panel{top:auto;left:10px;right:10px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);max-height:50vh;padding:20px 18px 16px;transform:translateY(calc(100% + 120px))}
  .panel h3{font-size:27px}
  body.panel-open .lower{opacity:0}
  .mk span{display:none}
  .btn .lbl{display:none}
  .btn{height:40px;min-width:40px;padding:0 9px}
  .lower{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}
  .dock{gap:5px;padding:6px}
  .pad{bottom:calc(env(safe-area-inset-bottom,0px) + 72px)}
}
@media (max-width:420px){ .ctl .opt{display:none} }
@media (prefers-reduced-motion: reduce){ .score .name i{animation:none} .count span{animation-duration:.01s} }
</style>
</head>
<body class="at-intro">
<canvas id="gl" aria-label="3D stadium game: run Abhishek’s career race. Tap things to interact."></canvas>
<div class="speed" id="speed"></div>
<div class="flash" id="flash"></div>
<div class="loading" id="loading">Warming up the stadium…</div>

<header class="score"><div class="name"><i aria-hidden="true"></i><span id="scoreName"></span></div><div class="event" id="eventName">Warm-up</div></header>
<div class="stats">
  <div class="stat scorebox"><b id="stScore">0</b><span>score</span><em class="mult" id="mult">×2</em></div>
  <div class="stat"><b id="stTime">0.0</b><span>time</span></div>
  <div class="stat"><b id="stSkills">0/0</b><span>skills</span></div>
  <div class="stat"><b id="stProj">0/0</b><span>projects</span></div>
</div>

<div class="lower" id="lower"><div class="who">Live</div><div class="text" id="comm" aria-live="polite"></div></div>
<div class="toast" id="toast" aria-hidden="true"></div>
<div class="tip" id="tip" aria-hidden="true"></div>
<div class="paused" role="dialog" aria-label="Paused"><div class="pause-card"><h2>Paused</h2><button class="primary" id="resumeBtn">Resume</button><button id="restartBtn2">Restart race</button><button id="pauseWatch">Watch the story instead</button></div></div>
<aside class="panel" id="panel" aria-live="polite"></aside>

<nav class="dock" aria-label="Race controls">

  if (marker.visible){ if (autoX === null){ marker.material.opacity -= rdt*2; if (marker.material.opacity <= 0) marker.visible = false; } else marker.scale.setScalar(1 + Math.sin(t*6)*.12); }
  [dust, sparks, ghosts].forEach(p => p.forEach(d => { if (d.life <= 0) return; d.life -= rdt*d.fade; d.v.y += d.g*rdt; d.s.position.addScaledVector(d.v, rdt); if (!d.g) d.v.multiplyScalar(.94);
    d.s.scale.setScalar(d.size*(p === sparks ? .25 + d.life*.25 : .3 + (1 - d.life)*1.1)); d.s.material.opacity = Math.max(0, d.life)*(p === ghosts ? .35 : .6); if (d.life <= 0) d.s.visible = false; }));
  if (shockT > 0){ shockT = Math.max(0, shockT - rdt*2.5); shock.scale.setScalar(1 + (1 - shockT)*4); shock.material.opacity = shockT*.6; }
  if (confOn){ let alive = false; for (let i=0;i<confN;i++){ const v = confVel[i]; v[1] -= 6*rdt; v[0] *= .99; v[2] *= .99; confPos[i*3] += v[0]*rdt; const ny = Math.max(NSTEP*STEP_H + .05, confPos[i*3+1] + v[1]*rdt); if (ny > NSTEP*STEP_H + .06) alive = true; confPos[i*3+1] = ny; confPos[i*3+2] += v[2]*rdt; }
    confGeo.attributes.position.needsUpdate = true; if (!alive) confOn = false; }

  // camera
  if (state === "intro"){ const a = t*.12; camera.position.set(Math.sin(a)*9, 3.2 + Math.sin(t*.2)*.6, 9 + Math.cos(a)*3); camera.lookAt(1.5, 1.6, 0); }
  else updateCamera(rdt, t);
  sun.position.set(R.x + 18, R.y + 34, 22); sun.target.position.set(R.x + 4, R.y, 0);
  $("#speed").style.opacity = reduceMotion ? 0 : R.dashT > 0 ? .5 : Math.max(0, (Math.abs(R.vx) - 10.5)/10);

  if (state !== "intro" && frame % 3 === 0){
    const p = pct(R.x); $("#mapRunner").style.left = (p*100) + "%"; $("#mapDone").style.width = (p*100) + "%";
    $("#stScore").textContent = score.toLocaleString();
    $("#stTime").textContent = raceT.toFixed(1);
    $("#stSkills").textContent = `${skillsGot}/${skills.length}`;
    $("#stProj").textContent = `${projSeen}/${P.projects.length}`;
    $("#dashFill").style.height = (R.dashCD/1.1*100) + "%";
  }
  renderer.render(scene, camera);
}
$("#loading").classList.add("gone"); tick();
})();
</script>
</body>
</html>
